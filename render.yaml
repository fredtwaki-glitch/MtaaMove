services:
  - type: web
    name: mtaamove-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mtaamove-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://mtaamove-web.onrender.com
  - type: web
    name: mtaamove-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mtaamove-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: mtaamove-db
    databaseName: mtaamove
    user: mtaamove_user
    plan: basic-256mb
